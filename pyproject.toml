[build-system]
requires = ["scikit-build-core >=0.4.3",
            "nanobind >=1.3.2",
            "klaycircuits",
            "setuptools-scm>=8",

]
build-backend = "scikit_build_core.build"

[project]
name = "kompyle"
dynamic = ["version"]
description = "interface to several d-DNNF knowledge compilers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "klaycircuits",
]
authors = [
    { name = "Ibrahim El Kaddouri" },
    { name = "Vincent Derkinderen" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = ["nanobind >=1.3.2",
       "pytest",
       "pytest-xdist",
       "pysdd",
       "torch == 2.9.0",
       "pyright",
       "cpplint",
       "auditwheel",
       "graphviz",
       "tqdm",
       "pandas",
       "matplotlib",
       "pyyaml",
       "notebook"
]

[project.urls]
Homepage = "https://github.com/ML-KULeuven/kompyle"


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.4"
cmake.build-type = "RelWithDebInfo"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

wheel.packages = ["python/kompyle"]

# Include CMakeLists.txt in source distribution
sdist.include = ["CMakeLists.txt"]

#[tool.cibuildwheel]
## Necessary to see build output from the actual compilation
#build-verbosity = 1
#
## Run pytest to ensure that the package was correctly built
#test-command = "pytest {project}/tests"
#test-requires = "pytest"
#
# Needed for full C++17 support
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
fallback_version = "0.0.0"
local_scheme = "no-local-version"
