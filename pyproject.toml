[build-system]
requires = [
    "scikit-build-core >=0.9.0",
    "nanobind >=1.3.2",
    "klaycircuits",
    "setuptools-scm>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "kompyle"
dynamic = ["version"]
description = "Python interface to several d-DNNF knowledge compilers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/**"]
dependencies = [
    "numpy",
    "klaycircuits",
]
authors = [
    { name = "Ibrahim El Kaddouri" },
    { name = "Vincent Derkinderen" },
]
keywords = [
    "knowledge compilation",
    "d-DNNF",
    "model counting",
    "SAT",
    "probabilistic inference",
    "Boolean circuits",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = [
    "nanobind >=1.3.2",
    "pytest",
    "pytest-xdist",
    "pysdd",
    "pyright",
    "cpplint",
    "auditwheel",
    "graphviz",
    "tqdm",
    "pandas",
    "matplotlib",
    "pyyaml",
    "notebook",
]

[project.urls]
Homepage = "https://github.com/ML-KULeuven/kompyle"
Source = "https://github.com/ML-KULeuven/kompyle"
"Issue Tracker" = "https://github.com/ML-KULeuven/kompyle/issues"


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.9"
cmake.build-type = "RelWithDebInfo"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

wheel.packages = ["python/kompyle"]

# Include CMakeLists.txt and all licenses in source distribution
sdist.include = ["CMakeLists.txt", "licenses/**"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
fallback_version = "0.0.0"
local_scheme = "no-local-version"
